parts_picture: The whole is cut into equal parts.
parts_top: Numerator
parts_bottom: Denominator
parts_less_n: Lower the numerator by one
parts_more_n: Raise the numerator by one
parts_less_d: Lower the denominator by one
parts_more_d: Raise the denominator by one
parts_divide: Divide the top and the bottom by {n}
parts_pieces: Pieces in each part
parts_gcd: Greatest common factor
parts_common: Common denominator
parts_clear: Clear
parts_same: Use the same parts
parts_own: Use their own parts
parts_goal_equal: The bar is cut into {n} equal parts. Shade {a} of it.
parts_goal_between: Set a fraction that lies between {a} and {b}.
parts_goal_sum: Set two fractions with different denominators that add up to {a}.
parts_hint_equal: Put the {n} parts into {d} equal groups. One group is {u} of the bar.
parts_hint_between: Try the denominator {n}, and step the numerator until the shaded share ends between the dashed lines.
parts_hint_sum: Pick the first fraction. Then work out how much is still missing to make {a}.
parts_lead: "Step the numbers up and down or type them, and watch the parts change."
