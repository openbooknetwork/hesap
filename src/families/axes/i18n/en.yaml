axes_goal-point-at: "Move P to {at}."
axes_hint-point-at: "The first number is x. Find {x} on the x axis, then go straight up or down until you are level with {y} on the y axis."
axes_goal-apart: "Place A and B exactly {d} apart, on a line that slants."
axes_hint-apart: "Δx² + Δy² has to make {d}², which is {sq}."
axes_goal-polar-at: "Move the point to x = {x}, y = {y}."
axes_hint-polar-at: "Turn θ to face that place from the origin, then set r to its distance from the origin."
axes_goal-rose-once: "Trace a rose with {n} petals, and stop where it closes."
axes_hint-rose-once: "An odd k gives k petals, and an even k gives twice as many. Past the angle where the rose closes, the point traces the same petals again."
axes_goal-square-box: "Build a box with a square base and a volume of {v}."
axes_hint-square-box: "A square base means a = b. The volume is then a × a × c."
axes_goal-same-volume: "Size the solid to hold as much as {solid}."
axes_hint-same-volume: "The volume to match is {v}."
axes_solid-cube: "a cube with edge {a}"
axes_solid-cuboid: "a box of {a} by {b} by {c}"
axes_solid-prism: "a prism with {n} sides of {a} and height {h}"
axes_solid-pyramid: "a pyramid with {n} sides of {a} and height {h}"
axes_solid-solid-cylinder: "a cylinder with r = {radius} and h = {h}"
axes_solid-cone: "a cone with r = {radius} and h = {h}"
axes_solid-ball: "a sphere with r = {radius}"
axes_lead: "Drag a point, move a slider or turn the view, and watch the numbers follow."
